<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array cheat sheet: Multidimensjonal array</title>

    <style>
        #books, #longreads {
            display: flex;
            gap: .5rem;
        }
        article{
            border: 1px, solid #ccc;
            background-color: #f3f3f3  ;
            padding: .5rem;
            box-sizing: border-box;
            width: 33%;
        }

    </style>


</head>
<body>
    <h2>Referansetest</h2>
    <p>Henter tittel på bok 3: <span id="book3Title"></span></p>
    <p>Henter forfatter 2 på bok 2: <span id="book2Author2"></span></p>

    <h2>Bokregister</h2>
    <section id="books">
        <p>Laster in bøker...</p>
    </section>

    <h2>Langlesning
        <section id="longreads">
            <p>Laster in bøker...</p>
        </section>

    </h2>

    <script>
        const bokregister = [
            {
                title: "Fourth Wing", 
                author: ["Rebecca Yarros"],
                pagecount: 512,
                isbn: 9780349437019
            },
            {
                title: "Silver eyes",
                author: ["Scott Cawthon", "Kira Wrisley"],
                pagecount: 365,
                isbn: 9781338134377
            },
            {
                title: "Harry Potter: De Vises Sten",
                author: ["J.K. Rowling"],
                pagecount: 333,
                isbn: 9788202523244

            }
        ]

        console.log(bokregister)

        //henter tittel på bok 3:
        document.getElementById("book3Title").innerHTML = bokregister[2].title
        //henter forfatter på bok 2
        document.getElementById("book2Author2").innerHTML = bokregister[1].author.join(", ")

        //Bruker .map for å hente alle bøker , og bygger HTML i booksHTML-variabelen
        let booksHTML = ""
        bokregister.map(b => {booksHTML += 
            `<article>
                <img src="https://covers.openlibrary.org/b/isbn/${b.isbn}-M.jpg" />
                <h3>${b.title}</h3>
                <p class="isbnnumber">${b.isbn}</p>
                <p>${b.author.length === 1 ? "Forfatter" : "Forfattere"}: ${b.author.join(", ")}</p>
                <p>Sidetall: ${b.pagecount}</p>
            </article>`
        })
        console.log(booksHTML)
        document.getElementById("books").innerHTML = booksHTML
        

        //Bruker .filter for å filtrere ut bøker med mer en 400 sider. 
        let longReadsHTML =""
        const longReads = bokregister.filter(l => l.pagecount >= 400)
        //const authors = bokregister.filter(l => l.author.length > 1)
        console.log("Longread: ", longReads)
        longReads.map(l => {
                longReadsHTML += `<article>
                <img src="https://covers.openlibrary.org/b/isbn/${l.isbn}-M.jpg" />
                <h3>${l.title}</h3>
                <p class="isbnnumber">${l.isbn}</p>
                <p>${l.author.length === 1 ? "Forfatter" : "Forfattere"}: ${l.author.join(", ")}</p>
                <p>Sidetall: ${l.pagecount}</p>
            </article>`
        
        })
        document.getElementById("longreads").innerHTML = longReadsHTML
    </script>
</body>
</html>
