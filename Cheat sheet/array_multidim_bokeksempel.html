<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array cheat sheet: Multidimensjonal array</title>
</head>
<body>
    <h2>Referansetest</h2>
    <p>Henter tittel på bok 3: <span id="book3Title"></span></p>
    <p>Henter forfatter 2 på bok 2: <span id="book2Author2"></span></p>
    <script>
        const bokregister = [
            {
                title: "Fourth Wing", 
                author: ["Rebecca Yarros"],
                pagecount: 512,
                isbn: 9783423220996
            },
            {
                title: "Silver eyes",
                author: ["Scott Cawthon", "Kira Wrisley"],
                pagecount: 365,
                isbn: 9781337134377
            },
            {
                title: "Harry Potter: De Vises Sten",
                author: ["J.K. Rowling"],
                pagecount: 333,
                isbn: 9788202434687

            }
        ]

        console.log(bokregister)

        //henter tittel på bok 3:
        document.getElementById("book3Title").innerHTML = bokregister[2].title
        //henter forfatter på bok 2
        document.getElementById("book2Author2").innerHTML = bokregister[1].author.join(", ")
    </script>
</body>
</html>
