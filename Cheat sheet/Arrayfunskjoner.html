<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet for Arrayfunksjoner</title>
</head>
<body>
    <h1>Arrayfunskjoner</h1>
    <p>Vi finner antall i en array ved å bruke .length <span id="arrayCount"></span></p>
    <h2>to måter og skrive ut en Array på</h2>
    <p>.tostring(): <span id="toString"></span></p>
    <p>.join(): <span id="join"></span></p>

    <h2>Array etter slettemetoder er kjørt</h2>
    <p id="deleted"></p>

    <h2>Sortering</h2>
    <p>Sortert A-Å: <span id ="sortAZ"></span></p>
    <p>sortert Å-A: <span id="sortZA"></span></p>

    <h2>Sortering av tall</h2>
    <p>Sortert 0-9: <span id="sort09"></span></p>
    <p>Sortert 9-0: <span id="sort90"></span></p>

    <Script>
        const books = [
            "Silver Eyes",
            "Harry potter og de vises sten",
            "Fourth Wing",
            "Bibelen",
            "Nålen",
            "Jævla drittsystem",
            "Don't make me think",
            "Twisted ones",
            "Hunger Games",
            "Sourrounded by idiots"
        ]

        
        //legge til elementer i arrayen
        //.push(element): Legger inn element på slutten av arrayen
        books.push("LOTR: Fellowship of the Ring")
        
        //.unshift(element): Legger inn element i starten av arrayen, og forskyver indexer!
        books.unshift("LOTR: Two Towers")
        
        // .splic(startindex, number of elements modified, element(s): 
        // startindex: hvilken index vi starter å manipulere array på
        // number of elements modified: hvis vi skal slette elementer, hvor mange fra og med startindex
        // startindex (eksempel: Hvis startindex er 2, og antal elementer er 2, slettes index 2 og 3). 
        // Når vi legger til elementer, skal number of elements modiefied være 0
        books.splice(5, 0, "LOTR: Return of the king")

        
        
        //.toString(): skriver ut en kommaseparet liste av en array
        document.getElementById("toString").innerHTML = books.toString()
        
        //.join(param):join skriver ut alle elementen i en array, sperarert av param
        document.getElementById("join").innerHTML = books.join(", ")

        document.getElementById("arrayCount").innerHTML = books.length

        //fjerne elementer i arrayen
        //pop denne sletter den siste elemente i arrayen
        books.pop()
        //.shift(): sletter den første elemente i arrayen
        books.shift()
        //.splice(startindex, number of elements to delete)
        //books.splice(4, 1)

        //.indexOf(param): Finner det første elementet i arrayen som matcher parameteren element, og returnerer indexen
        const indexFound = books.indexOf("LOTR: Return of the king")
        console.log("Index til LOTR-bok", indexFound)
        //Bruke indexOf-Verdien i Variablen indexFound til å slette riktig bok:
        books.splice(indexFound, 1)
        //Hvis elementet vi forsøker å finne indexen til ikke finnes, terurnerer indexOf -1

        //Hvordan skjekke om en verdi finnes i en array
        const bookExists = books.includes("Fourth Wing")
        console.log("Finnes fourth wing?", bookExists)
        

        document.getElementById("deleted").innerHTML = books.join(", ")

        document.getElementById("arrayCount").innerHTML = books.length
       

        //Sortere en array fra A til Å:
        books.sort()
        document.getElementById("sortAZ").innerHTML = books.join(", ")

        //Sortere en array fra Å til A:
        books.reverse()
        document.getElementById("sortZA").innerHTML = books.join(", ")

        //Sortere en array med tall
        const tall = [99, 6, 34, 8 , 9, 8, 111, 44, 83, 29, 6000, 15, 69, 366, 42]
        tall.sort(function(a, b ){return a - b})
        document.getElementById("sort09").innerHTML = tall.join(", ")

        tall.sort(function(a, b){return b - a})
        document.getElementById("sort90").innerHTML = tall.join(", ")
    </Script>
</body>
</html>
